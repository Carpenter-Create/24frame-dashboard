# Workspace root remains @24frame/dashboard (Vercel / root scripts).
# Mobile is a second package so Expo can live here without moving the Next app.
#
# packages:
#   apps/mobile = @24frame/mobile (Expo, iOS-first). Same 24Frame product.
#
# pnpm 11 keeps settings in this file (moved out of package.json).
packages:
  - "apps/mobile"
#
# Trusted native deps allowed to run install scripts:
# sharp = image processing (Next.js image optimization),
# unrs-resolver = eslint import resolver,
# esbuild = tsx binary for the finance worker (workers/finance/Dockerfile).
#
# @sentry/cli stays false: its postinstall downloads a native binary. Error
# reporting does not need it. Source-map upload can be enabled later by
# flipping this to true and setting SENTRY_AUTH_TOKEN — founder-gated.
allowBuilds:
  '@sentry/cli': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Transitive-only security floors (audit 2.1). None is a direct dependency, so they are
# pinned here rather than added to package.json:
#   postcss      >=8.5.18  arbitrary file read + path traversal (+ XSS in CSS stringify)
#   sharp        >=0.35.4  libheif GHSA-g89c-p67h-r497 / GHSA-2jg2-4ch7-h545 (was 0.35.0 for CVE-2026-33327)
#   js-yaml      4.x <4.3.2 → ^4.3.2  (GHSA-2883-xcg3-v3hh; ESLint tooling only)
#   browserslist 4.x <=4.28.6 → ^4.28.7 (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g; babel/next)
#   nanoid       3.x <3.3.17 → ^3.3.17 (GHSA-2v37-7h3g-55p8; postcss → next/tailwind/geist/vite)
#
# brace-expansion — NOW ACTUALLY FIXED, no longer an accepted exception.
#   Reached only as: exceljs > archiver > (archiver-utils|zip-stream) > glob@7 > minimatch@3,
#   and via ESLint's config matching.
#
#   An earlier attempt forced everything to 5.x and broke things: v5 changed its export shape
#   and minimatch@3 calls it as a default function ("TypeError: expand is not a function"),
#   which also put a broken minimatch under the .xlsx export path. That was reverted, and the
#   advisory was carried as an ignore on the reasoning that 1.1.16 and 2.1.2 were the newest
#   of their lines and both still vulnerable — so minimatch@3 had no backport to take.
#
#   THAT IS NO LONGER TRUE. The maintainers backported within each major. Floors are 1.1.20,
#   2.1.6, and 5.0.11 (GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p; earlier 1.1.18 / 2.1.4 /
#   5.0.9 covered GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895 only). Each line stays WITHIN
#   ITS OWN MAJOR, so minimatch@3 keeps the default-function export it calls.
#
#   CARET RANGES ARE LOAD-BEARING. A bare '>=1.1.20' is also satisfied by 5.0.11, so pnpm
#   resolves every line to 5.x and silently reintroduces exactly the breakage above. Observed
#   while making this change.
#
#   Verified after the bump: ESLint runs, and exceljs writes a valid .xlsx through the
#   archiver -> glob -> minimatch chain — the two things that failed last time.
#   Covers GHSA-mh99-v99m-4gvg and GHSA-rgw5-rvv9-x895 (CVE-2026-69152), the latter a bypass
#   of the incomplete CVE-2026-14257 mitigation. Re-check on every exceljs bump; the real fix
#   is still exceljs/archiver moving off glob@7.
overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.4'
  brace-expansion@<1.1.20: '^1.1.20'
  brace-expansion@>=2.0.0 <2.1.6: '^2.1.6'
  brace-expansion@>=4.0.0 <5.0.11: '^5.0.11'
  # Range-scoped within major — bare '>=' / unscoped caret can jump lines (see brace-expansion
  # note above). js-yaml is only 4.x here; browserslist is only 4.x; nanoid is only 3.x via postcss.
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  browserslist@<=4.28.6: '^4.28.7'
  nanoid@>=3.0.0 <3.3.17: '^3.3.17'

# Audit exceptions are declared here rather than by lowering the gate in CI: an exception you
# can see in a config file is a decision; one carried by weakening the threshold is a habit.
# (The old brace-expansion exception is gone; that advisory is fixed, not tolerated.)
#
# node-forge GHSA-86w9-cpqp-85rv (high, 2026-10-02) — founder decision pending in the PR that
# added it. No patched release exists: the registry's latest is 1.4.0 and GitHub lists no
# fixed version, so no override can satisfy it. It is reached only through the mobile app's
# Expo tooling (@24frame/mobile > expo > @expo/cli, and @expo/code-signing-certificates);
# nothing in the web app depends on it. When node-forge ships a fix, delete this entry and
# add a range-scoped floor under overrides instead.
#
# braces GHSA-vfj7-8cjw-p6xm (high, 2026-10-03) — founder-approved on #752. No patched release
# exists: the advisory names >=3.0.4 and the registry's latest is 3.0.3, so no override can
# satisfy it. Reached only through tooling, by way of micromatch: ESLint (eslint-config-next >
# @next/eslint-plugin-next > fast-glob, a web devDependency) and the mobile app's Metro bundler
# (expo > @expo/cli > metro-file-map). The DoS needs attacker-written glob patterns; these come
# from tool config only. When braces ships 3.0.4, delete this entry and add a range-scoped floor
# under overrides instead ('braces@<3.0.4': '^3.0.4').
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
